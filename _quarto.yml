project:
  type: website
  output-dir: _site

website:
  title: "José Ramón Juanes García"
  description: "PhD Candidate in Economics — University of Valencia"
  site-url: "https://joseramonjuanesgarcia.github.io"
  favicon: profile.jpg
  search: false

  navbar:
    background: light
    pinned: true
    left:
      - text: "About"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Teaching"
        href: teaching.qmd
    right:
      - icon: envelope
        href: "mailto:jose.r.juanes@uv.es"
        aria-label: Email
      - icon: linkedin
        href: "https://www.linkedin.com/in/joseramonjuanes"
        aria-label: LinkedIn

  page-footer:
    border: true
    left: "© 2026 José Ramón Juanes García"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/font/Serif/cmun-serif.css">
    grid:
      body-width: 900px
